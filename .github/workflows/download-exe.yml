name: 📦 Update Apps Folder in Repo

on:
  workflow_dispatch:          # اجرای دستی
  push:
    paths:
      - 'apps_config.json'    # هر وقت فایل کانفیگ تغییر کنه

jobs:
  update-apps:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # اجازه push به مخزن

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # از توکن پیش‌فرض گیت‌هاب استفاده کنه

      - name: 🧰 Install aria2
        run: sudo apt-get update && sudo apt-get install -y aria2

      - name: 🗂️ Create base apps folder
        run: mkdir -p apps

      - name: 🚀 Super‑fast download with aria2
        run: |
          # تابع دانلود فایل
          download_file() {
            local url="$1"
            local dest="$2"
            echo "⬇️ Downloading: $(basename "$dest")"
            aria2c -x 16 -s 16 --continue --max-tries=5 \
              --dir="$(dirname "$dest")" --out="$(basename "$dest")" "$url" || {
              echo "❌ Failed: $url"
            }
          }

          # خواندن JSON
          jq -c '.[]' apps_config.json | while read -r app; do
            app_name=$(echo "$app" | jq -r '.name')
            app_dir="apps/$app_name"
            mkdir -p "$app_dir"

            echo "=== $app_name ==="
            echo "$app" | jq -c '.downloads[]' | while read -r dl; do
              url=$(echo "$dl" | jq -r '.url')
              filename=$(echo "$dl" | jq -r '.filename // empty')
              [ -z "$filename" ] && filename=$(basename "$url" | cut -d'?' -f1)
              
              download_file "$url" "$app_dir/$filename" &
            done
            wait
            ls -l "$app_dir"
          done

      - name: 📤 Commit and push to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/
          
          # فقط اگر تغییری وجود داشت commit کن
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "⬆️ Update apps folder [skip ci]"
            git push
          fi
