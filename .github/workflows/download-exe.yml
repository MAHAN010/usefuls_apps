name: 📦 Download Apps with High Speed

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps_config.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Install aria2
        run: sudo apt-get update && sudo apt-get install -y aria2

      - name: 🗂️ Create base apps folder
        run: mkdir -p apps

      - name: 🚀 Fast parallel download using aria2c
        run: |
          # تابع دانلود یک فایل با aria2
          download_file() {
            local url="$1"
            local dest="$2"
            echo "⬇️ Downloading: $(basename "$dest")"
            # ۱۶ اتصال هم‌زمان، ادامه‌ی دانلود نیمه‌کاره، ۵ بار تلاش مجدد
            aria2c -x 16 -s 16 --continue=true --max-tries=5 --dir="$(dirname "$dest")" --out="$(basename "$dest")" "$url" || {
              echo "❌ Failed: $url" >> /dev/stderr
            }
          }

          # پردازش فایل JSON
          jq -c '.[]' apps_config.json | while read -r app; do
            app_name=$(echo "$app" | jq -r '.name')
            app_dir="apps/$app_name"
            mkdir -p "$app_dir"

            # استخراج همهٔ دانلودهای این برنامه و اجرای هم‌زمان آن‌ها
            echo "$app" | jq -c '.downloads[]' | while read -r dl; do
              url=$(echo "$dl" | jq -r '.url')
              filename=$(echo "$dl" | jq -r '.filename // empty')
              [ -z "$filename" ] && filename=$(basename "$url" | cut -d'?' -f1)
              
              # اجرای تابع دانلود در پس‌زمینه (موازی)
              download_file "$url" "$app_dir/$filename" &
            done
            
            # صبر کن تا همه دانلودهای این برنامه تموم بشن
            wait
            echo "✅ Finished downloading $app_name"
            ls -l "$app_dir"
          done

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apps-collection
          path: apps/
